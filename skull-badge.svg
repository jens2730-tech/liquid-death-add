<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 332" role="img" aria-labelledby="badgeTitle">
  <title id="badgeTitle">An original punk-badge illustration: a grinning skull wearing a crown of lightning bolts, crossbones behind it, set inside a spiky circular patch with drips running off the bottom.</title>

  <!-- outer starburst rays -->
  <g stroke="#2be37a" stroke-width="7" stroke-linecap="round">
    <line x1="288" y1="160" x2="318" y2="160"/>
    <line x1="250.5" y1="250.5" x2="271.7" y2="271.7"/>
    <line x1="160" y1="288" x2="160" y2="318"/>
    <line x1="69.5" y1="250.5" x2="48.3" y2="271.7"/>
    <line x1="32" y1="160" x2="2" y2="160"/>
    <line x1="69.5" y1="69.5" x2="48.3" y2="48.3"/>
    <line x1="160" y1="32" x2="160" y2="2"/>
    <line x1="250.5" y1="69.5" x2="271.7" y2="48.3"/>
  </g>

  <!-- drips off the bottom of the badge -->
  <g fill="#1fae5e">
    <path d="M132,266 Q132,296 142,308 Q152,296 150,266 Z"/>
    <path d="M168,270 Q168,308 180,322 Q192,308 188,270 Z"/>
    <path d="M198,264 Q198,288 206,298 Q214,288 212,264 Z"/>
  </g>

  <!-- badge ring -->
  <circle cx="160" cy="160" r="118" fill="#0b0b0c" stroke="#2be37a" stroke-width="7"/>
  <circle cx="160" cy="160" r="102" fill="none" stroke="#1fae5e" stroke-width="2"/>

  <!-- crossbones, behind the skull -->
  <g fill="#efece0" stroke="#0b0b0c" stroke-width="3">
    <rect x="118" y="188" width="92" height="15" rx="7.5" transform="rotate(38 160 196)"/>
    <rect x="118" y="188" width="92" height="15" rx="7.5" transform="rotate(-38 160 196)"/>
    <circle cx="120.5" cy="223.6" r="10" transform="rotate(38 160 196)"/>
    <circle cx="199.5" cy="223.6" r="10" transform="rotate(38 160 196)"/>
    <circle cx="120.5" cy="223.6" r="10" transform="rotate(-38 160 196)"/>
    <circle cx="199.5" cy="223.6" r="10" transform="rotate(-38 160 196)"/>
  </g>

  <!-- crown of lightning bolts -->
  <g fill="#d4ff3f" stroke="#0b0b0c" stroke-width="2.5">
    <path d="M160,46 L148,80 L158,80 L150,108 L176,74 L164,74 Z"/>
    <path d="M112,58 L100,88 L110,88 L104,112 L128,82 L118,82 Z" transform="rotate(-18 114 85)"/>
    <path d="M208,58 L196,88 L206,88 L200,112 L224,82 L214,82 Z" transform="rotate(18 206 85)"/>
  </g>

  <!-- skull -->
  <ellipse cx="160" cy="142" rx="56" ry="50" fill="#efece0" stroke="#0b0b0c" stroke-width="4"/>
  <ellipse cx="160" cy="176" rx="32" ry="20" fill="#efece0" stroke="#0b0b0c" stroke-width="4"/>

  <!-- teeth -->
  <g stroke="#0b0b0c" stroke-width="2.5">
    <line x1="140" y1="188" x2="140" y2="196"/>
    <line x1="150" y1="190" x2="150" y2="198"/>
    <line x1="160" y1="191" x2="160" y2="199"/>
    <line x1="170" y1="190" x2="170" y2="198"/>
    <line x1="180" y1="188" x2="180" y2="196"/>
  </g>

  <!-- eye sockets with a glow -->
  <circle cx="138" cy="136" r="15" fill="#0b0b0c"/>
  <circle cx="182" cy="136" r="15" fill="#0b0b0c"/>
  <circle cx="138" cy="136" r="6" fill="#2be37a"/>
  <circle cx="182" cy="136" r="6" fill="#2be37a"/>

  <!-- nose -->
  <path d="M160,148 L151,168 L169,168 Z" fill="#0b0b0c"/>

  <!-- big diagonal bolt crashing through the whole badge -->
  <path d="M276,18 L198,132 L232,132 L112,308 L164,166 L128,166 Z"
        fill="#d4ff3f" stroke="#0b0b0c" stroke-width="4" opacity="0.94"/>
</svg>
